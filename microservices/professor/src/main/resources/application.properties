quarkus.http.port=${QUARKUS_HTTP_PORT:8091}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5432/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Flyway dedicado ao dominio Aula (tabelas edc_aula*, migradas apos o restore).
# Desativado: o dominio Aula agora e migrado centralmente pelo login (V23/V24)
# e pelo restore do docker (0023/0024).
quarkus.datasource."aula".db-kind=postgresql
quarkus.datasource."aula".jdbc.url=${PROFESSOR_AULA_JDBC_URL:jdbc:postgresql://localhost:5432/olimpio}
quarkus.datasource."aula".username=${DATABASE_USER:postgres}
quarkus.datasource."aula".password=${DATABASE_PASSWORD:postgres}
quarkus.flyway."aula".locations=db/migration/aula
quarkus.flyway."aula".table=flyway_professor_aula_history
quarkus.flyway."aula".migrate-at-start=false
quarkus.flyway."aula".baseline-on-migrate=true
quarkus.flyway."aula".baseline-version=1
quarkus.flyway."aula".validate-on-migrate=false

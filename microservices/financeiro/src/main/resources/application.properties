quarkus.http.port=${QUARKUS_HTTP_PORT:8087}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.cache.caffeine."tipo-movimento-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-historico-cache".expire-after-write=1d

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Trigger manual de email de cobranca: consumido pelo notificacoes-service
# (EmailManualConsumer), dono do dominio de e-mail.
mp.messaging.outgoing.email-cobranca-manual-out.connector=smallrye-kafka
mp.messaging.outgoing.email-cobranca-manual-out.topic=olimpio.financeiro.email-manual
mp.messaging.outgoing.email-cobranca-manual-out.enable.idempotence=true
mp.messaging.outgoing.email-cobranca-manual-out.acks=all
mp.messaging.outgoing.email-cobranca-manual-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Trigger manual de fechamento de caixa: consumido pelo schedule-service
# (FechamentoCaixaManualConsumer).
mp.messaging.outgoing.fechamento-caixa-manual-out.connector=smallrye-kafka
mp.messaging.outgoing.fechamento-caixa-manual-out.topic=olimpio.financeiro.fechamento-manual
mp.messaging.outgoing.fechamento-caixa-manual-out.enable.idempotence=true
mp.messaging.outgoing.fechamento-caixa-manual-out.acks=all
mp.messaging.outgoing.fechamento-caixa-manual-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Trigger da regra de negocio atualizarCobrancasAutomatico: consumido pelo schedule-service.
mp.messaging.outgoing.financeiro-atualizar-cobrancas-out.connector=smallrye-kafka
mp.messaging.outgoing.financeiro-atualizar-cobrancas-out.topic=olimpio.financeiro.atualizar-cobrancas
mp.messaging.outgoing.financeiro-atualizar-cobrancas-out.enable.idempotence=true
mp.messaging.outgoing.financeiro-atualizar-cobrancas-out.acks=all
mp.messaging.outgoing.financeiro-atualizar-cobrancas-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Lote de cobranca: publica nos topicos do notificacoes-service (entrega por canal).
mp.messaging.outgoing.notificacao-email-out.connector=smallrye-kafka
mp.messaging.outgoing.notificacao-email-out.topic=olimpio.notificacao.email
mp.messaging.outgoing.notificacao-email-out.enable.idempotence=true
mp.messaging.outgoing.notificacao-email-out.acks=all
mp.messaging.outgoing.notificacao-email-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.notificacao-mobile-out.connector=smallrye-kafka
mp.messaging.outgoing.notificacao-mobile-out.topic=olimpio.notificacao.mobile
mp.messaging.outgoing.notificacao-mobile-out.enable.idempotence=true
mp.messaging.outgoing.notificacao-mobile-out.acks=all
mp.messaging.outgoing.notificacao-mobile-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.notificacao-web-out.connector=smallrye-kafka
mp.messaging.outgoing.notificacao-web-out.topic=olimpio.notificacao.web
mp.messaging.outgoing.notificacao-web-out.enable.idempotence=true
mp.messaging.outgoing.notificacao-web-out.acks=all
mp.messaging.outgoing.notificacao-web-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
quarkus.http.port=${QUARKUS_HTTP_PORT:8087}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.cache.caffeine."tipo-movimento-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-historico-cache".expire-after-write=1d

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Trigger manual de manutencao do financeiro (atualizarCobrancasAutomatico)
mp.messaging.outgoing.financeiro-maintenance-out.connector=smallrye-kafka
mp.messaging.outgoing.financeiro-maintenance-out.topic=olimpio.financeiro.maintenance
mp.messaging.outgoing.financeiro-maintenance-out.enable.idempotence=true
mp.messaging.outgoing.financeiro-maintenance-out.acks=all
mp.messaging.outgoing.financeiro-maintenance-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
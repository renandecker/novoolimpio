quarkus.http.port=${QUARKUS_HTTP_PORT:8087}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.cache.caffeine."tipo-movimento-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-historico-cache".expire-after-write=1d

# RabbitMQ connection
mp.messaging.outgoing.email-cobranca-manual-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.email-cobranca-manual-out.exchange.name=olimpio.financeiro.email-manual
mp.messaging.outgoing.email-cobranca-manual-out.exchange.declare=true
mp.messaging.outgoing.email-cobranca-manual-out.exchange.type=topic


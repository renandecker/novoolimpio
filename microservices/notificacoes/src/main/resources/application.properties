# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K
quarkus.http.port=${QUARKUS_HTTP_PORT:8082}
quarkus.application.name=olimpio-notificacoes-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*
# Canais de notificacao (default). A tabela not_config_canal (via API
# /api/notificacoes/config-canal) tem prioridade sobre estes valores.
olimpio.notificacoes.canal.sistema=${NOTIFICACOES_CANAL_SISTEMA:true}
olimpio.notificacoes.canal.mobile=${NOTIFICACOES_CANAL_MOBILE:true}
olimpio.notificacoes.canal.email=${NOTIFICACOES_CANAL_EMAIL:true}
# -----------------------------------------------------------------------------
# RabbitMQ - fluxo de envio de notificacoes por canal.
# Ao criar uma notificacao o microservico publica a mensagem no(s) exchange(s) do(s)
# canal(is) habilitado(s) (email, mobile, web) e um consumer de cada canal executa
# a entrega: EMAIL via SMTP (CanalEmailService), MOBILE e WEB via SSE em tempo real
# (NotificacaoStreamService) para o react-native e o react web.
# -----------------------------------------------------------------------------
# --- Producao: um exchange por canal de entrega ---
mp.messaging.outgoing.notificacao-email-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.notificacao-email-out.exchange.name=olimpio.notificacao.email
mp.messaging.outgoing.notificacao-email-out.exchange.declare=true
mp.messaging.outgoing.notificacao-email-out.exchange.type=topic

mp.messaging.outgoing.notificacao-mobile-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.notificacao-mobile-out.exchange.name=olimpio.notificacao.mobile
mp.messaging.outgoing.notificacao-mobile-out.exchange.declare=true
mp.messaging.outgoing.notificacao-mobile-out.exchange.type=topic

mp.messaging.outgoing.notificacao-web-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.notificacao-web-out.exchange.name=olimpio.notificacao.web
mp.messaging.outgoing.notificacao-web-out.exchange.declare=true
mp.messaging.outgoing.notificacao-web-out.exchange.type=topic

# --- Consumo: os mesmos exchanges, uma queue por canal ---
mp.messaging.incoming.notificacao-email-in.connector=smallrye-rabbitmq
mp.messaging.incoming.notificacao-email-in.queue.name=olimpio.notificacao.email
mp.messaging.incoming.notificacao-email-in.exchange.name=olimpio.notificacao.email
mp.messaging.incoming.notificacao-email-in.queue.durable=true
mp.messaging.incoming.notificacao-email-in.exchange.declare=true
mp.messaging.incoming.notificacao-email-in.exchange.type=topic

mp.messaging.incoming.notificacao-mobile-in.connector=smallrye-rabbitmq
mp.messaging.incoming.notificacao-mobile-in.queue.name=olimpio.notificacao.mobile
mp.messaging.incoming.notificacao-mobile-in.exchange.name=olimpio.notificacao.mobile
mp.messaging.incoming.notificacao-mobile-in.queue.durable=true
mp.messaging.incoming.notificacao-mobile-in.exchange.declare=true
mp.messaging.incoming.notificacao-mobile-in.exchange.type=topic

mp.messaging.incoming.notificacao-web-in.connector=smallrye-rabbitmq
mp.messaging.incoming.notificacao-web-in.queue.name=olimpio.notificacao.web
mp.messaging.incoming.notificacao-web-in.exchange.name=olimpio.notificacao.web
mp.messaging.incoming.notificacao-web-in.queue.durable=true
mp.messaging.incoming.notificacao-web-in.exchange.declare=true
mp.messaging.incoming.notificacao-web-in.exchange.type=topic

# --- Consumo: triggers manuais de e-mail (migrado do schedule) ---
# financeiro publica em olimpio.financeiro.email-manual (FinanceiroKafkaProducer)
# e educacao em olimpio.educacao.email-manual (EducacaoKafkaProducer);
# o consumo vive aqui (EmailManualConsumer) porque e-mail e deste microservico.
mp.messaging.incoming.email-cobranca-manual.connector=smallrye-rabbitmq
mp.messaging.incoming.email-cobranca-manual.queue.name=olimpio.financeiro.email-manual
mp.messaging.incoming.email-cobranca-manual.exchange.name=olimpio.financeiro.email-manual
mp.messaging.incoming.email-cobranca-manual.queue.durable=true
mp.messaging.incoming.email-cobranca-manual.exchange.declare=true
mp.messaging.incoming.email-cobranca-manual.exchange.type=topic

mp.messaging.incoming.email-nap-manual.connector=smallrye-rabbitmq
mp.messaging.incoming.email-nap-manual.queue.name=olimpio.educacao.email-manual
mp.messaging.incoming.email-nap-manual.exchange.name=olimpio.educacao.email-manual
mp.messaging.incoming.email-nap-manual.queue.durable=true
mp.messaging.incoming.email-nap-manual.exchange.declare=true
mp.messaging.incoming.email-nap-manual.exchange.type=topic

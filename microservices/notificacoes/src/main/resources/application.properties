# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K

quarkus.http.port=${QUARKUS_HTTP_PORT:8082}
quarkus.application.name=olimpio-notificacoes-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Canais de notificacao (default). A tabela not_config_canal (via API
# /api/notificacoes/config-canal) tem prioridade sobre estes valores.
olimpio.notificacoes.canal.sistema=${NOTIFICACOES_CANAL_SISTEMA:true}
olimpio.notificacoes.canal.mobile=${NOTIFICACOES_CANAL_MOBILE:true}
olimpio.notificacoes.canal.email=${NOTIFICACOES_CANAL_EMAIL:true}

# -----------------------------------------------------------------------------
# Kafka - fluxo de envio de notificacoes por canal.
# Ao criar uma notificacao o microservico publica a mensagem no(s) topico(s) do(s)
# canal(is) habilitado(s) (email, mobile, web) e um consumer de cada canal executa
# a entrega: EMAIL via SMTP (CanalEmailService), MOBILE e WEB via SSE em tempo real
# (NotificacaoStreamService) para o react-native e o react web.
# -----------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# --- Producao: um topico por canal de entrega ---
mp.messaging.outgoing.notificacao-email-out.connector=smallrye-kafka
mp.messaging.outgoing.notificacao-email-out.topic=olimpio.notificacao.email
mp.messaging.outgoing.notificacao-email-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.notificacao-mobile-out.connector=smallrye-kafka
mp.messaging.outgoing.notificacao-mobile-out.topic=olimpio.notificacao.mobile
mp.messaging.outgoing.notificacao-mobile-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.notificacao-web-out.connector=smallrye-kafka
mp.messaging.outgoing.notificacao-web-out.topic=olimpio.notificacao.web
mp.messaging.outgoing.notificacao-web-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Consumo: os mesmos topicos, um consumidor (grupo) por canal ---
mp.messaging.incoming.notificacao-email-in.connector=smallrye-kafka
mp.messaging.incoming.notificacao-email-in.topic=olimpio.notificacao.email
mp.messaging.incoming.notificacao-email-in.group.id=olimpio-notificacoes-email
mp.messaging.incoming.notificacao-email-in.auto.offset.reset=earliest
mp.messaging.incoming.notificacao-email-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notificacao-email-in.failure-strategy=ignore

mp.messaging.incoming.notificacao-mobile-in.connector=smallrye-kafka
mp.messaging.incoming.notificacao-mobile-in.topic=olimpio.notificacao.mobile
mp.messaging.incoming.notificacao-mobile-in.group.id=olimpio-notificacoes-mobile
mp.messaging.incoming.notificacao-mobile-in.auto.offset.reset=earliest
mp.messaging.incoming.notificacao-mobile-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notificacao-mobile-in.failure-strategy=ignore

mp.messaging.incoming.notificacao-web-in.connector=smallrye-kafka
mp.messaging.incoming.notificacao-web-in.topic=olimpio.notificacao.web
mp.messaging.incoming.notificacao-web-in.group.id=olimpio-notificacoes-web
mp.messaging.incoming.notificacao-web-in.auto.offset.reset=earliest
mp.messaging.incoming.notificacao-web-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notificacao-web-in.failure-strategy=ignore

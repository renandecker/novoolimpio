quarkus.http.port=${QUARKUS_HTTP_PORT:8094}
quarkus.http.cors=true
quarkus.http.cors.origins=*

# O proxy gerado da collection Postman tem duplicidades de rota (ex.: POST /v3/payments
# e POST /v3/payments/ apontam pro mesmo endpoint do Asaas). Como o Quarkus normaliza a
# barra final, transformamos o erro de build em warning e mantemos so a primeira rota.
quarkus.rest.fail-on-duplicate=false

# ---------------------------------------------------------------------------------------------
# Microsservico "asaas": proxy/gateway para a API de pagamentos do Asaas (gerado a partir da
# collection Postman "Asaas Collection") + camada de servico local (FinAsaasParcela) que
# espelha as cobrancas criadas no Asaas na tabela fin_asaas_parcela, atendendo webhooks e
# servindo telas do app. O access_token do Asaas fica so aqui no servidor (ver AsaasAuth).
# ---------------------------------------------------------------------------------------------

# URL base da API do Asaas. Por padrao aponta pro sandbox (ambiente de testes do Asaas);
# em producao, trocar para https://api.asaas.com via a variavel de ambiente.
quarkus.rest-client.asaas-api.url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com}

# Chave de API do Asaas (obrigatoria para qualquer chamada funcionar de verdade) - gerar em
# Configuracoes > Integracoes > API no painel do Asaas (sandbox ou producao).
# ASAAS_API_KEY=<definir via variavel de ambiente, nao commitar aqui>

# Datasource default (reativo) usado pelo Hibernate Reactive Panache (FinAsaasParcela).
# No Docker, DATABASE_URL aponta para o banco olimpio (ver docker-compose.yml).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5432/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none

# Datasource JDBC dedicado para o Flyway (a tabela fin_asaas_parcela ja vem no backup
# olimpio.sql restaurado pelo compose; a migracao abaixo e idempotente e cobre instalacoes novas).
quarkus.datasource."asaas".db-kind=postgresql
quarkus.datasource."asaas".jdbc.url=${ASAAS_JDBC_URL:jdbc:postgresql://localhost:5432/olimpio}
quarkus.datasource."asaas".username=${DATABASE_USER:postgres}
quarkus.datasource."asaas".password=${DATABASE_PASSWORD:postgres}
quarkus.flyway."asaas".locations=db/migration/asaas
quarkus.flyway."asaas".migrate-at-start=true
quarkus.flyway."asaas".baseline-on-migrate=true
quarkus.flyway."asaas".baseline-version=1
quarkus.flyway."asaas".validate-on-migrate=false

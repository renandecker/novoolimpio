# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K
quarkus.http.port=${QUARKUS_HTTP_PORT:8089}
# Banco de dados compartilhado (olimpio), igual aos demais microsservicos
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.http.cors=true
quarkus.http.cors.origins=*
# Liga/desliga os jobs agendados (util pra nao rodar sem querer em dev/teste)
scheduler.jobs.enabled=${SCHEDULER_JOBS_ENABLED:true}
# Horarios dos jobs (cron, formato Quartz: seg min hora dia mes dia-semana), sobrescrevivel por env
# A rotina de manutencao diaria roda a partir da 1h da manha; fluxo de caixa e correcao de
# avaliacoes permanecem as 23h.
scheduler.tudo.cron=${SCHEDULER_TUDO_CRON:0 0 1 * * ?}
scheduler.fechamento-caixa.cron=${SCHEDULER_FECHAMENTO_CAIXA_CRON:0 0 23 * * ?}
scheduler.corrigir-avaliacoes.cron=${SCHEDULER_CORRIGIR_AVALIACOES_CRON:0 0 23 * * ?}
# ---------------------------------------------------------------------------------------------
# Kafka: o schedule recebe triggers manuais dos microsservicos de dominio
# (basico, financeiro, educacao) e executa as regras de manutencao.
# ---------------------------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Trigger manual de feriados do basico
mp.messaging.incoming.feriado-manual.connector=smallrye-kafka
mp.messaging.incoming.feriado-manual.topic=olimpio.basico.feriado-manual
mp.messaging.incoming.feriado-manual.group.id=olimpio-schedule-feriado-manual
mp.messaging.incoming.feriado-manual.auto.offset.reset=earliest
# Trigger manual de email cobranca do financeiro
mp.messaging.incoming.email-cobranca-manual.connector=smallrye-kafka
mp.messaging.incoming.email-cobranca-manual.topic=olimpio.financeiro.email-manual
mp.messaging.incoming.email-cobranca-manual.group.id=olimpio-schedule-email-cobranca
mp.messaging.incoming.email-cobranca-manual.auto.offset.reset=earliest
# Trigger manual de email NAP do educacao
mp.messaging.incoming.email-nap-manual.connector=smallrye-kafka
mp.messaging.incoming.email-nap-manual.topic=olimpio.educacao.email-manual
mp.messaging.incoming.email-nap-manual.group.id=olimpio-schedule-email-nap
mp.messaging.incoming.email-nap-manual.auto.offset.reset=earliest
# Trigger manual de manutencao do educacao (corrigirAvaliacoes, carregarChamadasPendentes, removerExtratores)
mp.messaging.incoming.educacao-maintenance.connector=smallrye-kafka
mp.messaging.incoming.educacao-maintenance.topic=olimpio.educacao.maintenance
mp.messaging.incoming.educacao-maintenance.group.id=olimpio-schedule-educacao-maintenance
mp.messaging.incoming.educacao-maintenance.auto.offset.reset=earliest
# Trigger manual de fechamento de caixa do financeiro
mp.messaging.incoming.fechamento-caixa-manual.connector=smallrye-kafka
mp.messaging.incoming.fechamento-caixa-manual.topic=olimpio.financeiro.fechamento-manual
mp.messaging.incoming.fechamento-caixa-manual.group.id=olimpio-schedule-fechamento-caixa
mp.messaging.incoming.fechamento-caixa-manual.auto.offset.reset=earliest
# Habilita a execucao dos metodos anotados com @RunOnVirtualThread (Java 21+)
quarkus.thread-virtual.enabled=true

quarkus.http.port=${QUARKUS_HTTP_PORT:8089}

# Banco de dados compartilhado (olimpio), igual aos demais microsservicos
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5432/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.http.cors=true
quarkus.http.cors.origins=*

# ---------------------------------------------------------------------------------------------
# Este microsservico NAO faz chamadas REST para os outros microsservicos: as rotinas agendadas
# acessam diretamente o banco de cada dominio (basico, financeiro, central, educacao, comercial,
# relatorios, empresa/curriculo) via datasources reativos nomeados (so SQL nativo - Hibernate
# Reactive nao suporta multiplas persistence units, por isso os maintenance services usam
# Pool + @ReactiveDataSource).
# ---------------------------------------------------------------------------------------------

quarkus.datasource."basico-db".db-kind=postgresql
quarkus.datasource."basico-db".reactive.url=${BASICO_DATABASE_URL:postgresql://localhost:5432/olimpio}
quarkus.datasource."basico-db".username=${DATABASE_USER:postgres}
quarkus.datasource."basico-db".password=${DATABASE_PASSWORD:postgres}

quarkus.datasource."financeiro-db".db-kind=postgresql
quarkus.datasource."financeiro-db".reactive.url=${FINANCEIRO_DATABASE_URL:postgresql://localhost:5432/olimpio}
quarkus.datasource."financeiro-db".username=${DATABASE_USER:postgres}
quarkus.datasource."financeiro-db".password=${DATABASE_PASSWORD:postgres}

quarkus.datasource."central-db".db-kind=postgresql
quarkus.datasource."central-db".reactive.url=${CENTRAL_DATABASE_URL:postgresql://localhost:5432/olimpio}
quarkus.datasource."central-db".username=${DATABASE_USER:postgres}
quarkus.datasource."central-db".password=${DATABASE_PASSWORD:postgres}

quarkus.datasource."educacao-db".db-kind=postgresql
quarkus.datasource."educacao-db".reactive.url=${EDUCACAO_DATABASE_URL:postgresql://localhost:5432/olimpio}
quarkus.datasource."educacao-db".username=${DATABASE_USER:postgres}
quarkus.datasource."educacao-db".password=${DATABASE_PASSWORD:postgres}

quarkus.datasource."comercial-db".db-kind=postgresql

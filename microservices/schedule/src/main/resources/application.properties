# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K
quarkus.http.port=${QUARKUS_HTTP_PORT:8089}
# Banco de dados compartilhado (olimpio), igual aos demais microsservicos
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.http.cors=true
quarkus.http.cors.origins=*
# Liga/desliga os jobs agendados (util pra nao rodar sem querer em dev/teste)
scheduler.jobs.enabled=${SCHEDULER_JOBS_ENABLED:true}
# Horarios dos jobs (cron, formato Quartz: seg min hora dia mes dia-semana), sobrescrevivel por env
# A rotina de manutencao diaria roda a partir da 1h da manha; fluxo de caixa e correcao de
# avaliacoes permanecem as 23h.
scheduler.tudo.cron=${SCHEDULER_TUDO_CRON:0 0 1 * * ?}
scheduler.fechamento-caixa.cron=${SCHEDULER_FECHAMENTO_CAIXA_CRON:0 0 23 * * ?}
scheduler.corrigir-avaliacoes.cron=${SCHEDULER_CORRIGIR_AVALIACOES_CRON:0 0 23 * * ?}
# ---------------------------------------------------------------------------------------------
# Kafka: o schedule recebe triggers manuais dos microsservicos de dominio
# (basico, financeiro, educacao) e executa as regras de manutencao.
# Os triggers de e-mail manual (olimpio.financeiro.email-manual e
# olimpio.educacao.email-manual) NAO sao mais consumidos aqui: o consumo migrou para
# o notificacoes-service (EmailManualConsumer), que e o dono do dominio de e-mail.
# Aqui permanecem apenas a rotina automatica (SchedulingJobs.rotinaEmails) e os
# triggers de manutencao/fechamento/feriado abaixo.
# ---------------------------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Producao: ao fechar cada caixa, o e-mail de fechamento (regra portada do legado,
# SchedulingService.fechamentoCaixaAbertos + CaixaService.textoEmailCaixa) e publicado
# no topico olimpio.financeiro.email-manual; quem entrega e o notificacoes-service.
mp.messaging.outgoing.fechamento-email-out.connector=smallrye-kafka
mp.messaging.outgoing.fechamento-email-out.topic=olimpio.financeiro.email-manual
mp.messaging.outgoing.fechamento-email-out.enable.idempotence=true
mp.messaging.outgoing.fechamento-email-out.acks=all
mp.messaging.outgoing.fechamento-email-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Trigger manual de feriados do basico
mp.messaging.incoming.feriado-manual.connector=smallrye-kafka
mp.messaging.incoming.feriado-manual.topic=olimpio.basico.feriado-manual
mp.messaging.incoming.feriado-manual.group.id=olimpio-schedule-feriado-manual
mp.messaging.incoming.feriado-manual.auto.offset.reset=earliest
# Manutencao do educacao: um topico por regra de negocio.
mp.messaging.incoming.educacao-corrigir-avaliacoes.connector=smallrye-kafka
mp.messaging.incoming.educacao-corrigir-avaliacoes.topic=olimpio.educacao.corrigir-avaliacoes
mp.messaging.incoming.educacao-corrigir-avaliacoes.group.id=olimpio-schedule-educacao-corrigir-avaliacoes
mp.messaging.incoming.educacao-corrigir-avaliacoes.auto.offset.reset=earliest
mp.messaging.incoming.educacao-carregar-chamadas.connector=smallrye-kafka
mp.messaging.incoming.educacao-carregar-chamadas.topic=olimpio.educacao.carregar-chamadas-pendentes
mp.messaging.incoming.educacao-carregar-chamadas.group.id=olimpio-schedule-educacao-carregar-chamadas
mp.messaging.incoming.educacao-carregar-chamadas.auto.offset.reset=earliest
mp.messaging.incoming.educacao-remover-extratores.connector=smallrye-kafka
mp.messaging.incoming.educacao-remover-extratores.topic=olimpio.educacao.remover-extratores-antigos
mp.messaging.incoming.educacao-remover-extratores.group.id=olimpio-schedule-educacao-remover-extratores
mp.messaging.incoming.educacao-remover-extratores.auto.offset.reset=earliest
# Trigger manual de fechamento de caixa do financeiro
mp.messaging.incoming.fechamento-caixa-manual.connector=smallrye-kafka
mp.messaging.incoming.fechamento-caixa-manual.topic=olimpio.financeiro.fechamento-manual
mp.messaging.incoming.fechamento-caixa-manual.group.id=olimpio-schedule-fechamento-caixa
mp.messaging.incoming.fechamento-caixa-manual.auto.offset.reset=earliest
# Regra de negocio atualizarCobrancasAutomatico do financeiro (nome do topico segue a regra).
mp.messaging.incoming.financeiro-atualizar-cobrancas.connector=smallrye-kafka
mp.messaging.incoming.financeiro-atualizar-cobrancas.topic=olimpio.financeiro.atualizar-cobrancas
mp.messaging.incoming.financeiro-atualizar-cobrancas.group.id=olimpio-schedule-financeiro-atualizar-cobrancas
mp.messaging.incoming.financeiro-atualizar-cobrancas.auto.offset.reset=earliest
# Pagamento confirmado (fiserv/cartao + asaas/PIX): aplica a baixa na fin_parcela
# via PagamentoConfirmadoConsumer/PagamentoConfirmadoService.
mp.messaging.incoming.pagamento-confirmado.connector=smallrye-kafka
mp.messaging.incoming.pagamento-confirmado.topic=olimpio.pagamento.confirmado
mp.messaging.incoming.pagamento-confirmado.group.id=olimpio-schedule-pagamento-confirmado
mp.messaging.incoming.pagamento-confirmado.auto.offset.reset=earliest
mp.messaging.incoming.pagamento-confirmado.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Habilita a execucao dos metodos anotados com @RunOnVirtualThread (Java 21+)
quarkus.thread-virtual.enabled=true
quarkus.cdi.composite-config=classpath*:META-INF/beans.xml

# Email (quarkus-mailer) - configuracao SMTP para envio de relatorios de fechamento de caixa
quarkus.mailer.auth-methods=DISABLED
quarkus.mailer.from=${MAIL_FROM:noreply@olimpio.local}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:25}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.tls=${MAIL_TLS:false}
quarkus.mailer.ssl=${MAIL_SSL:false}

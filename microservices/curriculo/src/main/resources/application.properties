# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K
quarkus.http.port=${QUARKUS_HTTP_PORT:8095}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*
# Flyway dedicado ao dominio Curriculo. A migracao (V26) foi centralizada no
# login service (restore + flyway do login); aqui apenas mantemos a config desativada.
quarkus.datasource."curriculo".db-kind=postgresql
quarkus.datasource."curriculo".jdbc.url=${CURRICULO_JDBC_URL:jdbc:postgresql://localhost:5454/olimpio}
quarkus.datasource."curriculo".username=${DATABASE_USER:postgres}
quarkus.datasource."curriculo".password=${DATABASE_PASSWORD:postgres}
quarkus.flyway."curriculo".locations=db/migration/curriculo
quarkus.flyway."curriculo".table=flyway_curriculo_history
quarkus.flyway."curriculo".migrate-at-start=false
quarkus.flyway."curriculo".baseline-on-migrate=true
quarkus.flyway."curriculo".baseline-version=1
quarkus.flyway."curriculo".validate-on-migrate=false

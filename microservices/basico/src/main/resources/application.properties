# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K
quarkus.http.port=${QUARKUS_HTTP_PORT:8081}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.cache.caffeine."tipo-unidade-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-telefone-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-agenda-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-compromisso-cache".expire-after-write=1d
quarkus.cache.caffeine."modulo-menu-cache".expire-after-write=1d
quarkus.cache.caffeine."mapa-menu-cache".expire-after-write=1d
quarkus.cache.caffeine."unidade-list-cache".expire-after-write=1d
quarkus.cache.caffeine."fin-banco-cache".expire-after-write=1d
quarkus.cache.caffeine."fin-banco-config-cache".expire-after-write=1d
# ---------------------------------------------------------------------------------------------
# Kafka: o basico publica triggers de ajuste de feriados para o microsservico schedule
# (FeriadoKafkaProducer -> FeriadoManualConsumer no schedule).
# A regra de ajuste agora e executada no schedule (FeriadoAjusteMaintenanceService).
# ---------------------------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.feriado-manual-out.connector=smallrye-kafka
mp.messaging.outgoing.feriado-manual-out.topic=olimpio.basico.feriado-manual
mp.messaging.outgoing.feriado-manual-out.enable.idempotence=true
mp.messaging.outgoing.feriado-manual-out.acks=all
# Habilita a execucao dos metodos anotados com @RunOnVirtualThread (Java 21+)
quarkus.thread-virtual.enabled=true
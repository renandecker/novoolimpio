# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K
quarkus.http.port=${QUARKUS_HTTP_PORT:8084}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.cache.caffeine."tipo-canal-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-acao-cache".expire-after-write=1d

# Enable SQL logging
quarkus.hibernate-orm.log.sql=true
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.type.descriptor.sql".level=TRACE
quarkus.log.category."br.com.sol7.olimpio".level=DEBUG

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.incoming.kafka-requests-in.connector=smallrye-kafka
mp.messaging.incoming.kafka-requests-in.topic=olimpio.comercial.requests
mp.messaging.incoming.kafka-requests-in.group.id=olimpio-comercial-requests
mp.messaging.incoming.kafka-requests-in.auto.offset.reset=earliest
mp.messaging.incoming.kafka-requests-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.outgoing.kafka-responses-out.connector=smallrye-kafka
mp.messaging.outgoing.kafka-responses-out.topic=olimpio.comercial.responses
mp.messaging.outgoing.kafka-responses-out.enable.idempotence=true
mp.messaging.outgoing.kafka-responses-out.acks=all
mp.messaging.outgoing.kafka-responses-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.arquivo-procon-out.connector=smallrye-kafka
mp.messaging.outgoing.arquivo-procon-out.topic=olimpio.comercial.arquivo-procon
mp.messaging.outgoing.arquivo-procon-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.arquivo-procon-in.connector=smallrye-kafka
mp.messaging.incoming.arquivo-procon-in.topic=olimpio.comercial.arquivo-procon
mp.messaging.incoming.arquivo-procon-in.group.id=olimpio-comercial-arquivo-procon-group
mp.messaging.incoming.arquivo-procon-in.auto.offset.reset=earliest
mp.messaging.incoming.arquivo-procon-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
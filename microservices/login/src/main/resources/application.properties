quarkus.http.port=${QUARKUS_HTTP_PORT:8090}
quarkus.http.cors=true
quarkus.http.cors.origins=*
# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K
# Menu/permissões por usuário (bas_usuario_perfil + bas_perfil + bas_perfil_modulo):
# os dados só mudam diariamente (rotina do schedule), então o cache dura 1 dia.
quarkus.cache.caffeine."login-menu-cache".expire-after-write=1d
quarkus.cache.caffeine."login-admin-cache".expire-after-write=1d
# Datasource default (reativo) usado pelo Hibernate Reactive Panache (LoginRepository/Login).
# No Docker, DATABASE_URL aponta para o banco olimpio (ver docker-compose.yml).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.datasource."login".db-kind=postgresql
quarkus.datasource."login".jdbc.url=${LOGIN_JDBC_URL:jdbc:postgresql://localhost:5454/olimpio}
quarkus.datasource."login".reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource."login".username=${DATABASE_USER:postgres}
quarkus.datasource."login".password=${DATABASE_PASSWORD:postgres}
quarkus.flyway."login".locations=db/migration/login
quarkus.flyway."login".migrate-at-start=true
quarkus.flyway."login".baseline-on-migrate=true
quarkus.flyway."login".baseline-version=1
quarkus.flyway."login".validate-on-migrate=false
# Envio de e-mail (fluxo "esqueci minha senha").
# As credenciais SMTP sao lidas da tabela bas_email (MailService), priorizando o
# registro com fl_principal = true e, na ausencia, o primeiro registro. Quando a
# tabela estiver sem configuracao (host vazio), a senha provisoria e apenas
# registrada no log do login service.
# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K
quarkus.application.name=olimpio-fiserv
# ---------------------------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------------------------
quarkus.http.port=${QUARKUS_HTTP_PORT:8085}
quarkus.http.cors=true
quarkus.http.cors.origins=*
# ---------------------------------------------------------------------------------------------
# Banco de dados (mesmo banco 'olimpio', schema compartilhado com o basico-service)
# ---------------------------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
# Flyway desativado: a migracao de pagamento (V2__pagamento_fiserv.sql, = V21 do login) e
# aplicada pelo restore do Docker. A migracao de PIX (V3__ajuste_pix.sql) foi movida para o
# asaas-service (db/migration/asaas/V3__ajuste_pix.sql; no Docker = 0022__ajuste_pix.sql).
# Necessario pois o Flyway usa uma conexao JDBC "sincrona" separada da reativa acima
quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5454/olimpio}
quarkus.cache.caffeine."cartao-pessoa-cache".expire-after-write=10m
quarkus.cache.caffeine."fin-banco-config-cache".expire-after-write=10m
# ---------------------------------------------------------------------------------------------
# RabbitMQ (segue o mesmo padrao do basico-service; publica eventos de pagamento confirmado)
# ---------------------------------------------------------------------------------------------
mp.messaging.outgoing.pagamento-confirmado.connector=smallrye-rabbitmq
mp.messaging.outgoing.pagamento-confirmado.exchange.name=olimpio.pagamento.confirmado
mp.messaging.outgoing.pagamento-confirmado.exchange.declare=true
mp.messaging.outgoing.pagamento-confirmado.exchange.type=topic
# Habilita a execucao dos metodos anotados com @RunOnVirtualThread (Java 21+)
quarkus.thread-virtual.enabled=true
# ---------------------------------------------------------------------------------------------
# JWT (mesmo segredo/emissor usado pelo basico-service, para validar o token entre microsservicos)
# ---------------------------------------------------------------------------------------------
# JWT_SECRET e lido diretamente da variavel de ambiente pela classe JwtTokenService
# ---------------------------------------------------------------------------------------------
# Fiserv Commerce Hub / Payments Gateway (IPP) - credenciais do Developer Studio
# https://developer.fiserv.com  |  https://docs.fiserv.dev/public/docs/message-signature
# ---------------------------------------------------------------------------------------------
# Ambiente: cert.emea.api.fiservapps.com (sandbox) ou prod.emea.api.fiservapps.com (producao)
fiserv.base-url=${FISERV_BASE_URL:https://cert.emea.api.fiservapps.com}
fiserv.api-key=${FISERV_API_KEY:}
fiserv.api-secret=${FISERV_API_SECRET:}
fiserv.store-id=${FISERV_STORE_ID:}
fiserv.currency=${FISERV_CURRENCY:BRL}
fiserv.timeout-ms=${FISERV_TIMEOUT_MS:15000}
# Rest Client reativo usado pelo FiservPaymentClient (a URL efetiva e sobrescrita em runtime
# pelo FiservClientConfig com base em fiserv.base-url, mas o Quarkus exige um valor de build)
quarkus.rest-client."br.com.sol7.olimpio.pagamento.gateway.fiserv.FiservPaymentClient".url=${FISERV_BASE_URL:https://cert.emea.api.fiservapps.com}
quarkus.rest-client."br.com.sol7.olimpio.pagamento.gateway.fiserv.FiservPaymentClient".connect-timeout-ms=${FISERV_TIMEOUT_MS:15000}
quarkus.rest-client."br.com.sol7.olimpio.pagamento.gateway.fiserv.FiservPaymentClient".read-timeout-ms=${FISERV_TIMEOUT_MS:15000}


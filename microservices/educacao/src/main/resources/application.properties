# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K
quarkus.http.port=${QUARKUS_HTTP_PORT:8085}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.cache.caffeine."tipo-sala-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-matriz-curricular-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-curso-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-contrato-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-atividade-cache".expire-after-write=1d
# ---------------------------------------------------------------------------------------------
# Kafka: o educacao publica triggers manuais para o microsservico schedule (email NAP).
# ---------------------------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.email-nap-manual-out.connector=smallrye-kafka
mp.messaging.outgoing.email-nap-manual-out.topic=olimpio.educacao.email-manual
mp.messaging.outgoing.email-nap-manual-out.enable.idempotence=true
mp.messaging.outgoing.email-nap-manual-out.acks=all
mp.messaging.outgoing.email-nap-manual-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.educacao-maintenance-out.connector=smallrye-kafka
mp.messaging.outgoing.educacao-maintenance-out.topic=olimpio.educacao.maintenance
mp.messaging.outgoing.educacao-maintenance-out.enable.idempotence=true
mp.messaging.outgoing.educacao-maintenance-out.acks=all
mp.messaging.outgoing.educacao-maintenance-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Habilita a execucao dos metodos anotados com @RunOnVirtualThread (Java 21+)
quarkus.thread-virtual.enabled=true

# Email (quarkus-mailer) - configuracao SMTP para envio de relatorios
quarkus.mailer.auth-methods=DISABLED
quarkus.mailer.from=${MAIL_FROM:noreply@olimpio.local}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:25}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.tls=${MAIL_TLS:false}
quarkus.mailer.ssl=${MAIL_SSL:false}

# Email enabled flag
educacao.email.enabled=${EDUCACAO_EMAIL_ENABLED:true}
educacao.email.from=${EDUCACAO_EMAIL_FROM:noreply@olimpio.local}

# Storage config for apresentacao images and videos
olimpio.storage.base-path=${OLIMPIO_STORAGE_BASE_PATH:${user.home}/repositorio-olimpio}
olimpio.storage.apresentacao-imagem-path=apresentacaoimagem
olimpio.storage.apresentacao-video-path=apresentacaovideo
# Defesa extra: o padrao do Quarkus/Vert.x e 8K por header. O Authorization
# carrega o JWT (que pode crescer com permissoes por modulo); aumentar aqui
# evita que um token grande derrube a requisicao antes mesmo do filtro de
# autenticacao rodar. Ver LoginService.issueSession, que ja evita embutir o
# mapa completo de modulos no token do admin -- isto e so uma margem extra.
quarkus.http.limits.max-header-size=32K
quarkus.http.port=${QUARKUS_HTTP_PORT:8085}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.cache.caffeine."tipo-sala-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-matriz-curricular-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-curso-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-contrato-cache".expire-after-write=1d
quarkus.cache.caffeine."tipo-atividade-cache".expire-after-write=1d
# ---------------------------------------------------------------------------------------------
# RabbitMQ: o educacao publica triggers manuais.
# - email NAP -> consumido pelo notificacoes-service (dono do dominio de e-mail);
# - maintenance -> consumido pelo schedule-service.
# ---------------------------------------------------------------------------------------------
# Producer: email NAP manual para notificacoes
mp.messaging.outgoing.email-nap-manual-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.email-nap-manual-out.exchange.name=olimpio.educacao.email-manual
mp.messaging.outgoing.email-nap-manual-out.exchange.declare=true
mp.messaging.outgoing.email-nap-manual-out.exchange.type=topic

# Manutencao: um exchange por regra de negocio (consumidos pelo schedule-service).
mp.messaging.outgoing.corrigir-avaliacoes-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.corrigir-avaliacoes-out.exchange.name=olimpio.educacao.corrigir-avaliacoes
mp.messaging.outgoing.corrigir-avaliacoes-out.exchange.declare=true
mp.messaging.outgoing.corrigir-avaliacoes-out.exchange.type=topic

mp.messaging.outgoing.carregar-chamadas-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.carregar-chamadas-out.exchange.name=olimpio.educacao.carregar-chamadas-pendentes
mp.messaging.outgoing.carregar-chamadas-out.exchange.declare=true
mp.messaging.outgoing.carregar-chamadas-out.exchange.type=topic

mp.messaging.outgoing.remover-extratores-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.remover-extratores-out.exchange.name=olimpio.educacao.remover-extratores-antigos
mp.messaging.outgoing.remover-extratores-out.exchange.declare=true
mp.messaging.outgoing.remover-extratores-out.exchange.type=topic

# Lote do NAP: publica nos exchanges do notificacoes-service (entrega por canal).
mp.messaging.outgoing.notificacao-email-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.notificacao-email-out.exchange.name=olimpio.notificacao.email
mp.messaging.outgoing.notificacao-email-out.exchange.declare=true
mp.messaging.outgoing.notificacao-email-out.exchange.type=topic

mp.messaging.outgoing.notificacao-mobile-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.notificacao-mobile-out.exchange.name=olimpio.notificacao.mobile
mp.messaging.outgoing.notificacao-mobile-out.exchange.declare=true
mp.messaging.outgoing.notificacao-mobile-out.exchange.type=topic

mp.messaging.outgoing.notificacao-web-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.notificacao-web-out.exchange.name=olimpio.notificacao.web
mp.messaging.outgoing.notificacao-web-out.exchange.declare=true
mp.messaging.outgoing.notificacao-web-out.exchange.type=topic

# Producer generico: eventos de notificacao para o notificacoes-service (chamada generica)
mp.messaging.outgoing.notificacao-generic-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.notificacao-generic-out.exchange.name=olimpio.notificacao.generic
mp.messaging.outgoing.notificacao-generic-out.exchange.declare=true
mp.messaging.outgoing.notificacao-generic-out.exchange.type=topic
# Habilita a execucao dos metodos anotados com @RunOnVirtualThread (Java 21+)
quarkus.thread-virtual.enabled=true

# Email (quarkus-mailer) - configuracao SMTP para envio de relatorios
quarkus.mailer.auth-methods=DISABLED
quarkus.mailer.from=${MAIL_FROM:noreply@olimpio.local}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:25}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.tls=${MAIL_TLS:false}
quarkus.mailer.ssl=${MAIL_SSL:false}

# Email enabled flag
educacao.email.enabled=${EDUCACAO_EMAIL_ENABLED:true}
educacao.email.from=${EDUCACAO_EMAIL_FROM:noreply@olimpio.local}

# Storage config for apresentacao images and videos
olimpio.storage.base-path=${OLIMPIO_STORAGE_BASE_PATH:${user.home}/repositorio-olimpio}
olimpio.storage.apresentacao-imagem-path=apresentacaoimagem
olimpio.storage.apresentacao-video-path=apresentacaovideo
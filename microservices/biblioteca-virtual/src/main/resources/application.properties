quarkus.http.port=${QUARKUS_HTTP_PORT:8099}
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.limits.max-header-size=32K

quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.datasource."biblioteca-virtual".db-kind=postgresql
quarkus.datasource."biblioteca-virtual".jdbc.url=${BIBLIOTECA_VIRTUAL_JDBC_URL:jdbc:postgresql://localhost:5454/olimpio}
quarkus.datasource."biblioteca-virtual".reactive.url=${DATABASE_URL:postgresql://localhost:5454/olimpio}
quarkus.datasource."biblioteca-virtual".username=${DATABASE_USER:postgres}
quarkus.datasource."biblioteca-virtual".password=${DATABASE_PASSWORD:postgres}
quarkus.flyway."biblioteca-virtual".locations=db/migration/biblioteca-virtual
quarkus.flyway."biblioteca-virtual".migrate-at-start=true
quarkus.flyway."biblioteca-virtual".baseline-on-migrate=true
quarkus.flyway."biblioteca-virtual".baseline-version=1
quarkus.flyway."biblioteca-virtual".validate-on-migrate=false

quarkus.cache.caffeine."biblioteca-virtual-livro-cache".expire-after-write=1h
quarkus.cache.caffeine."biblioteca-virtual-licenca-cache".expire-after-write=1h

mp.messaging.outgoing.emprestimo.connector=smallrye-rabbitmq
mp.messaging.outgoing.emprestimo.exchange=olimpio
mp.messaging.outgoing.emprestimo.routing-key=biblioteca-virtual.emprestimo
mp.messaging.outgoing.emprestimo-digital-connector.connector=smallrye-rabbitmq
mp.messaging.outgoing.emprestimo-digital-connector.exchange=olimpio
mp.messaging.outgoing.emprestimo-digital-connector.routing-key=biblioteca-virtual.emprestimo-digital
mp.messaging.outgoing.fila-espera-connector.connector=smallrye-rabbitmq
mp.messaging.outgoing.fila-espera-connector.exchange=olimpio
mp.messaging.outgoing.fila-espera-connector.routing-key=biblioteca-virtual.fila-espera
    image: rabbitmq:3.13-management-alpine
    container_name: olimpio-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
    - "5672:5672"
    - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  basico:
    build:
      context: ./microservices
      dockerfile: basico/Dockerfile
    container_name: olimpio-basico
    restart: unless-stopped
    environment:

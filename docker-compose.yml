      DATABASE_URL: postgresql://postgres:5432/olimpio
    ports:
    - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/q/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      restore:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      login:
        condition: service_healthy



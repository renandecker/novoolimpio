# Sobe: 1 Postgres (com um banco por microsservico), os microsservicos Quarkus
# (cada um numa porta fixa), um gateway Nginx (porta 8080) e o app React (porta 3000).
#
# Uso:
#   docker compose up --build          # sobe tudo
#   docker compose up --build -d       # sobe tudo em background
#   docker compose logs -f basico      # acompanha logs de um servico
#   docker compose down                # para tudo
#   docker compose down -v             # para tudo e apaga os dados do banco
#
# Portas no host:
#   5454  Postgres
#   9092  Kafka (broker usado pelo schedule para publicar triggers e pelo basico
#         para consumir o topico olimpio.schedule.feriado)
#   8080  Gateway (roteia /api/<modulo>/... para o microsservico certo)
#   8081  basico
#   8082  notificacoes
#   8083  central
#   8084  comercial
#   8085  educacao
#   8086  estoque
#   8087  financeiro
#   8088  relatorios
#   8089  schedule
#   8090  login
#   8091  professor
#   8092  aluno
#   8094  asaas
#   8095  curriculo (dominio Empresa/Curriculo cur_*)
#   8097  fiserv (cartao Fiserv; publica olimpio.pagamento.confirmado no Kafka)
#   3000  web-react (app React)

name: olimpio

x-service-env: &service-env
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres
  JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-em-producao-olimpio}
  QUARKUS_HTTP_CORS_ORIGINS: "*"

services:
  postgres:
    image: postgres:16-alpine
    container_name: olimpio-postgres
    restart: unless-stopped
    command: postgres -c max_wal_size=2GB -c checkpoint_timeout=15min
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5454:5432"
    volumes:
      - olimpio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Restaura o backup docker/postgres/olimpio.sql no banco 'olimpio' a cada start.
  # Sobe depois do Postgres ficar saudavel, termina (exit 0) e so entao os
  # microsservicos iniciam (depends_on: restore -> service_completed_successfully).
  restore:
    image: postgres:16-alpine
    container_name: olimpio-restore
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      # Monta a pasta postgres inteira dentro de /backup
      - ./docker/postgres:/backup:ro 
    entrypoint: ["/bin/sh", "-e", "-c"]
    command:
      - |
        echo "[restore] Aguardando o Postgres aceitar conexoes..."
        until pg_isready -h postgres -U postgres; do sleep 1; done
        echo "[restore] Restaurando 001_olimpio.sql no banco 'olimpio'..."
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -c "DROP DATABASE IF EXISTS olimpio WITH (FORCE);"
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -c "CREATE DATABASE olimpio;"
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/olimpio.sql
        echo "[restore] Aplicando migracoes..."
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/002_create_bas_login.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/003__temas.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/004__admin_login.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/005__admin_acesso_total.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/006__login_session.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/007__menu_react_e_perfil_admin.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/008__provisionar_usuarios_legados.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/008_1__asaas_menu.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/009__acesso_aluno.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0010__remove_whatsapp_telegram.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0011__menu_recriar_calendario_academico.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0012__remove_pagina_inicial.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0013__corrigir_modulo_genero.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0014__temas_posicao_e_menu.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0015__foto_base64_usuario.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0015_1__menu_lote_nap_cobranca.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0015_2__auditoria_menu.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0017__fiserv.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0018__financeiro_aluno.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0019__admin_acesso_total.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0020__perfil_admin_acesso_total.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0021__pagamento_fiserv.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0022__ajuste_pix.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0023__schema_aula.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0024__avaliacao_fl_ativo.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0025__asaas_base.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0026__schema_curriculo.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0027__menu_curriculo.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0028__create_notificacoes.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0029__icones_menu_principais.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0030__menu_aluno.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/0031__remove_biblioteca_livros.sql
        echo "[restore] Restore concluido."

  # Broker Kafka (KRaft). O schedule publica os triggers de rotina e o basico
  # consome o topico olimpio.schedule.feriado.
  kafka:
    image: apache/kafka:3.9.0
    container_name: olimpio-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
      
  basico:
    build: ./microservices/basico
    container_name: olimpio-basico
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      restore:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      login:
        condition: service_healthy


  notificacoes:
    build: ./microservices/notificacoes
    container_name: olimpio-notificacoes
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      restore:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      login:
        condition: service_healthy

  central:
    build: ./microservices/central
    container_name: olimpio-central
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
    ports:
      - "8083:8083"
    depends_on:
      restore:
        condition: service_completed_successfully
      login:
        condition: service_healthy

  comercial:
    build: ./microservices/comercial
    container_name: olimpio-comercial
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
    ports:
      - "8084:8084"
    depends_on:
      restore:
        condition: service_completed_successfully
      login:
        condition: service_healthy

  educacao:
    build: ./microservices/educacao
    container_name: olimpio-educacao
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    depends_on:
      restore:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      login:
        condition: service_healthy

  estoque:
    build: ./microservices/estoque
    container_name: olimpio-estoque
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
    ports:
      - "8086:8086"
    depends_on:
      restore:
        condition: service_completed_successfully
      login:
        condition: service_healthy

  financeiro:
    build: ./microservices/financeiro
    container_name: olimpio-financeiro
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
    ports:
      - "8087:8087"
    depends_on:
      restore:
        condition: service_completed_successfully
      login:
        condition: service_healthy

  relatorios:
    build: ./microservices/relatorios
    container_name: olimpio-relatorios
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
    ports:
      - "8088:8088"
    depends_on:
      restore:
        condition: service_completed_successfully
      login:
        condition: service_healthy

  schedule:
    build: ./microservices/schedule
    container_name: olimpio-schedule
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
      BASICO_DATABASE_URL: postgresql://postgres:5432/olimpio
      FINANCEIRO_DATABASE_URL: postgresql://postgres:5432/olimpio
      CENTRAL_DATABASE_URL: postgresql://postgres:5432/olimpio
      EDUCACAO_DATABASE_URL: postgresql://postgres:5432/olimpio
      COMERCIAL_DATABASE_URL: postgresql://postgres:5432/olimpio
      RELATORIOS_DATABASE_URL: postgresql://postgres:5432/olimpio
      EMPRESA_DATABASE_URL: postgresql://postgres:5432/olimpio
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RELATORIOS_TABELAS_PATH: /tmp/olimpio/tabelas
    ports:
      - "8089:8089"
    depends_on:
      restore:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      login:
        condition: service_healthy

  professor:
    build: ./microservices/professor
    container_name: olimpio-professor
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
      PROFESSOR_AULA_JDBC_URL: jdbc:postgresql://postgres:5432/olimpio
    ports:
      - "8091:8091"
    depends_on:
      restore:
        condition: service_completed_successfully
      login:
        condition: service_healthy

  login:
    build: ./microservices/login
    container_name: olimpio-login
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
      LOGIN_JDBC_URL: jdbc:postgresql://postgres:5432/olimpio
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/q/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      restore:
        condition: service_completed_successfully

  aluno:
    build: ./microservices/aluno
    container_name: olimpio-aluno
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
      ALUNO_AULA_JDBC_URL: jdbc:postgresql://postgres:5432/olimpio
    ports:
      - "8092:8092"
    depends_on:
      restore:
        condition: service_completed_successfully
      login:
        condition: service_healthy

  curriculo:
    build: ./microservices/curriculo
    container_name: olimpio-curriculo
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
      CURRICULO_JDBC_URL: jdbc:postgresql://postgres:5432/olimpio
    ports:
      - "8095:8095"
    depends_on:
      restore:
        condition: service_completed_successfully
      login:
        condition: service_healthy

  asaas:
    build: ./microservices/asaas
    container_name: olimpio-asaas
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
      ASAAS_JDBC_URL: jdbc:postgresql://postgres:5432/olimpio
      ASAAS_API_KEY: $$aact_hmlg_000MzkwODA2MWY2OGM3MWRlMDU2NWM3MzJlNzZmNGZhZGY6OjE1MjVlNjliLTRhMDItNDkzZC1hMTI0LTcyYjgzNjVmMDNhNDo6JGFhY2hfYmM0OGJjMTQtZDk1OC00MDVmLWEyYmUtODQxN2U1YTY4MTFk
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8094:8094"
    depends_on:
      restore:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      login:
        condition: service_healthy
        
  fiserv:
    build: ./microservices/fiserv
    container_name: olimpio-fiserv
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8097:8096"
    depends_on:
      restore:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      login:
        condition: service_healthy
        
  # O modulo Fiserv (cartao) vive em fiserv (porta 8097); o fluxo PIX (Asaas) vive em asaas-service (porta 8094).
  
  gateway:
    build: ./docker/gateway
    container_name: olimpio-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - aluno
      - asaas
      - basico
      - central
      - comercial
      - curriculo
      - educacao
      - estoque
      - financeiro
      - login
      - notificacoes
      - fiserv
      - professor
      - relatorios
      - schedule

  web-react:
    build:
      context: ./web-react
      args:
        VITE_API_URL: http://localhost:8080
    container_name: olimpio-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  olimpio-postgres-data:

# Sobe: 1 Postgres (com um banco por microsservico), os microsservicos Quarkus
# (cada um numa porta fixa), um gateway Nginx (porta 8080) e o app React (porta 3000).
#
# Uso:
#   docker compose up --build          # sobe tudo
#   docker compose up --build -d       # sobe tudo em background
#   docker compose logs -f basico      # acompanha logs de um servico
#   docker compose down                # para tudo
#   docker compose down -v             # para tudo e apaga os dados do banco
#
# Portas no host:
#   5454  Postgres
#   5672  RabbitMQ (broker usado para mensageria entre microsservicos)
#   15672 RabbitMQ Management UI
#   8080  Gateway (roteia /api/<modulo>/... para o microsservico certo)
#   8081  basico
#   8082  notificacoes
#   8083  central
#   8084  comercial
#   8085  educacao
#   8086  estoque
#   8087  financeiro
#   8088  relatorios
#   8089  schedule
#   8090  login
#   8091  professor
#   8092  aluno
#   8094  asaas
#   8095  curriculo (dominio Empresa/Curriculo cur_*)
#   8097  fiserv (cartao Fiserv; publica olimpio.pagamento.confirmado no RabbitMQ)
#   3000  web-react (app React)

name: olimpio

x-service-env: &service-env
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres
  JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-em-producao-olimpio}
  QUARKUS_HTTP_CORS_ORIGINS: "*"
  # Connection pool limits (Agroal) - total across 14 services ~168 connections < 300 max_connections
  QUARKUS_DATASOURCE_MAX_SIZE: "12"
  QUARKUS_DATASOURCE_MIN_SIZE: "2"
  # RabbitMQ connection
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
  RABBITMQ_VHOST: /

services:
  postgres:
    image: postgres:16-alpine
    container_name: olimpio-postgres
    restart: unless-stopped
    command: postgres -c max_wal_size=2GB -c checkpoint_timeout=15min -c max_connections=500
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
    - "5454:5432"
    volumes:
    - olimpio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Restaura o backup docker/postgres/olimpio.sql no banco 'olimpio' a cada start.
  # Sobe depois do Postgres ficar saudavel, termina (exit 0) e so entao os
  # microsservicos iniciam (depends_on: restore -> service_completed_successfully).
  #
  # Aqui ficam SO os scripts de bootstrap, nao as migracoes. O restore baixa o
  # dump, garante o login do admin e o acesso total, e limpa o legado da
  # biblioteca. Todo o restante do historico e aplicacao pelo Flyway do
  # microsservico login (microservices/login/src/main/resources/db/migration/login),
  # que roda com migrate-at-start=true assim que o login sobe. Isso elimina a
  # duplicacao que existia entre esta pasta e o Flyway -- e o risco de as duas
  # copias divergirem, como ja aconteceu com 0089__cleanup_biblioteca_legacy.sql,
  # cujo arquivo foi apagado e deixava o restore abortando em sh -e.
  restore:
    image: postgres:16-alpine
    container_name: olimpio-restore
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
    # Monta a pasta postgres inteira dentro de /backup
    - ./docker/postgres:/backup:ro
    entrypoint: ["/bin/sh", "-e", "-c"]
    command:
      - |
        echo "[restore] Aguardando o Postgres aceitar conexoes..."
        until pg_isready -h postgres -U postgres; do sleep 1; done
        echo "[restore] Restaurando olimpio.sql no banco 'olimpio'..."
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -c "DROP DATABASE IF EXISTS olimpio WITH (FORCE);"
        sleep 1
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -c "CREATE DATABASE olimpio;"
        sleep 1
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f /backup/olimpio.sql
        echo "[restore] Aplicando bootstrap..."
        # O laco pega qualquer 0*.sql novo sem precisar editar o compose: o glob
        # ja ordena por nome, entao 004 -> 005 -> 006 sai na ordem. O $$ e o
        # escape de interpolacao do Compose (o mesmo do ASAAS_API_KEY mais abaixo).
        for f in /backup/0*.sql; do
          echo "[restore]   $$f"
          psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d olimpio -f "$$f"
        done
        echo "[restore] Restore concluido. As migracoes restantes rodam no Flyway do login."

  # Broker RabbitMQ. Substitui o Kafka para mensageria entre microsservicos.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: olimpio-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
    - "5672:5672"
    - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  basico:
    build:
      context: ./microservices
      dockerfile: basico/Dockerfile
    container_name: olimpio-basico
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://postgres:5432/olimpio
    ports:
    - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/q/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      restore:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      login:

worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 20m;

    map $status $cors_origin { default '*'; }

    # Todos os controllers dos microsservicos seguem o padrao /api/<modulo>/<feature>...
    # Este gateway roteia pelo segundo segmento do path ($modulo) para o container certo.

    server {
        listen 8080;

        location /api/aluno/       { set $upstream http://aluno:8092;       rewrite ^/api/aluno/(.*)$       /api/aluno/$1 break;       proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/asaas/       { set $upstream http://asaas:8094;       rewrite ^/api/asaas/(.*)$       /api/asaas/$1 break;       proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/basico/      { set $upstream http://basico:8081;      rewrite ^/api/basico/(.*)$      /api/basico/$1 break;      proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/central/     { set $upstream http://central:8083;     rewrite ^/api/central/(.*)$     /api/central/$1 break;     proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/comercial/   { set $upstream http://comercial:8084;   rewrite ^/api/comercial/(.*)$   /api/comercial/$1 break;   proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/curriculo/   { set $upstream http://curriculo:8095;   rewrite ^/api/curriculo/(.*)$   /api/curriculo/$1 break;   proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/educacao/    { set $upstream http://educacao:8085;    rewrite ^/api/educacao/(.*)$    /api/educacao/$1 break;    proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/estoque/     { set $upstream http://estoque:8086;     rewrite ^/api/estoque/(.*)$     /api/estoque/$1 break;     proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/financeiro/  { set $upstream http://financeiro:8087;  rewrite ^/api/financeiro/(.*)$  /api/financeiro/$1 break;  proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/login/       { set $upstream http://login:8090;       rewrite ^/api/login/(.*)$       /api/login/$1 break;       proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/notificacoes/ { set $upstream http://notificacoes:8082; rewrite ^/api/notificacoes/(.*)$ /api/notificacoes/$1 break; proxy_set_header Authorization $http_authorization; proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; proxy_pass $upstream; }
        location /api/pagamento/   { set $upstream http://pagamento:8096;     rewrite ^/api/pagamento/(.*)$   /api/pagamento/$1 break;   proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/professor/   { set $upstream http://professor:8091;   rewrite ^/api/professor/(.*)$   /api/professor/$1 break;   proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/relatorios/  { set $upstream http://relatorios:8088;  rewrite ^/api/relatorios/(.*)$  /api/relatorios/$1 break;  proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/schedule/    { set $upstream http://schedule:8089;    rewrite ^/api/schedule/(.*)$    /api/schedule/$1 break;    proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }
        location /api/view/        { set $upstream http://basico:8081;     rewrite ^/api/view/(.*)$        /api/view/$1 break;        proxy_set_header Authorization $http_authorization; proxy_pass $upstream; }

        location / {
            return 404 '{"error":"rota nao mapeada - use /api/<modulo>/..."}';
            add_header Content-Type application/json;
        }
    }
}

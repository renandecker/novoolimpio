worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 20m;

    # Defesa extra contra headers grandes (ex.: Authorization: Bearer <JWT>).
    # Os microsservicos ja foram ajustados (quarkus.http.limits.max-header-size=32K,
    # ver LoginService.issueSession, que evita embutir o mapa completo de modulos
    # no token do admin); os buffers abaixo dao a mesma margem aqui no gateway,
    # para que o Nginx nao rejeite/trunque a requisicao antes de repassa-la.
    large_client_header_buffers 4 32k;
    client_header_buffer_size   32k;

    proxy_buffer_size       32k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    # CORS: Os microsservicos Quarkus ja respondem com headers CORS (QUARKUS_HTTP_CORS_ORIGINS).
    # O gateway adiciona headers CORS apenas para rotas nao mapeadas (404) e preflight OPTIONS
    # que nao sao repassadas aos microsservicos, evitando duplicacao de headers.
    # Para rotas /api/<modulo>/, o upstream (microsservico) ja envia os headers CORS.

    server {
        listen 8080;

        # Health Check do proprio Gateway (retorna 200 OK para scripts de monitoramento)
        location = /q/health {
            access_log off;
            default_type application/json;
            return 200 '{"status": "UP"}';
        }

location /api/aluno/        { set $upstream http://aluno:8092;       rewrite ^/api/aluno/(.*)$       /api/aluno/$1 break;       proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/asaas/        { set $upstream http://asaas:8094;       rewrite ^/api/asaas/(.*)$       /api/asaas/$1 break;       proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/basico/       { set $upstream http://basico:8081;      rewrite ^/api/basico/(.*)$      /api/basico/$1 break;      proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/biblioteca-fisica/   { set $upstream http://biblioteca:8098;       rewrite ^/api/biblioteca-fisica/(.*)$   /api/biblioteca-fisica/$1 break;   proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/biblioteca-virtual/  { set $upstream http://biblioteca-virtual:8099; rewrite ^/api/biblioteca-virtual/(.*)$  /api/biblioteca-virtual/$1 break;  proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/biblioteca/          { set $upstream http://biblioteca:8098;       rewrite ^/api/biblioteca/(.*)$          /api/biblioteca/$1 break;          proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/central/      { set $upstream http://central:8083;     rewrite ^/api/central/(.*)$     /api/central/$1 break;     proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/comercial/    { set $upstream http://comercial:8084;   rewrite ^/api/comercial/(.*)$   /api/comercial/$1 break;   proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/curriculo/    { set $upstream http://curriculo:8095;   rewrite ^/api/curriculo/(.*)$   /api/curriculo/$1 break;   proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/educacao/     { set $upstream http://educacao:8085;    rewrite ^/api/educacao/(.*)$    /api/educacao/$1 break;    proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/estoque/      { set $upstream http://estoque:8086;     rewrite ^/api/estoque/(.*)$     /api/estoque/$1 break;     proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/financeiro/   { set $upstream http://financeiro:8087;  rewrite ^/api/financeiro/(.*)$  /api/financeiro/$1 break;  proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/login/        { set $upstream http://login:8090;       rewrite ^/api/login/(.*)$       /api/login/$1 break;       proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/icones { set $upstream http://login:8090;       rewrite ^/api/icones/(.*)$      /api/icones/$1 break;       proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/permissao/    { set $upstream http://login:8090;       rewrite ^/api/permissao/(.*)$   /api/permissao/$1 break;   proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/notificacoes/ { set $upstream http://notificacoes:8082; rewrite ^/api/notificacoes/(.*)$ /api/notificacoes/$1 break; proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; proxy_pass $upstream; }
        location /api/pagamento/    { set $upstream http://fiserv:8096;      rewrite ^/api/pagamento/(.*)$   /api/pagamento/$1 break;   proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/professor/    { set $upstream http://professor:8091;   rewrite ^/api/professor/(.*)$   /api/professor/$1 break;   proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/relatorios/   { set $upstream http://relatorios:8088;  rewrite ^/api/relatorios/(.*)$  /api/relatorios/$1 break;  proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/schedule/     { set $upstream http://schedule:8089;    rewrite ^/api/schedule/(.*)$    /api/schedule/$1 break;    proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }
        location /api/view/         { set $upstream http://basico:8081;      rewrite ^/api/view/(.*)$        /api/view/$1 break;        proxy_set_header Authorization $http_authorization; proxy_set_header X-Authenticated-Username $http_x_authenticated_username; proxy_pass $upstream; }

        location / {
            # CORS headers para rotas nao mapeadas (evita erro CORS no 404)
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Authenticated-Username" always;
            add_header Access-Control-Max-Age 86400 always;

            # Responde ao preflight OPTIONS
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Authenticated-Username" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            return 404 '{"error":"rota nao mapeada - use /api/<modulo>/..."}';
            add_header Content-Type application/json;
        }
    }
}